<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>tetsudo-site6</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
    }

    .container {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      background: #fff;
    }

    header {
      background: #1976d2;
      color: #fff;
      padding: 12px 16px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 22px;
      text-align: center;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 14px;
      color: #fff;
      border: 1px solid #fff4;
      transition: 0.2s;
      white-space: nowrap;
    }

    .tab:hover {
      background: #fff3;
    }

    .tab.active {
      background: #fff;
      color: #1976d2;
      font-weight: 600;
    }

    .search-bar {
      padding: 10px 16px;
      background: #e3f2fd;
    }

    .search-bar input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #bbb;
      font-size: 15px;
    }

    main {
      padding: 12px 16px 24px;
    }

    .section-title {
      font-size: 18px;
      margin: 10px 0 16px;
      text-align: center;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      border-left: 6px solid #ccc;
      transition: 0.2s;
    }

    .card:hover {
      background: #f0f7ff;
    }

    .card-category {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-detail {
      font-size: 14px;
      color: #555;
    }

    .edit-buttons {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit-btn, .delete-btn {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      color: #fff;
    }

    .edit-btn { background: #1976d2; }
    .delete-btn { background: #d32f2f; }

    /* カテゴリ色 */
    .cat-京王 { border-left-color: #ff80ab; }
    .cat-JR { border-left-color: #4caf50; }
    .cat-大手私鉄 { border-left-color: #ffd54f; }
    .cat-その他 { border-left-color: #9e9e9e; }
    .cat-資料 { border-left-color: #ba68c8; }

    .settings {
      max-width: 520px;
      margin: 0 auto;
    }

    .settings label {
      font-size: 14px;
      display: block;
      margin: 10px 0 4px;
    }

    .settings input,
    .settings select,
    .settings textarea {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #bbb;
    }

    .settings textarea {
      resize: vertical;
      min-height: 70px;
    }

    .settings button {
      margin-top: 10px;
      padding: 10px 14px;
      font-size: 15px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    #cloudLoad {
      background: #4caf50;
      color: #fff;
    }
    #cloudSave {
      background: #1976d2;
      color: #fff;
    }
    #cloudLoad:hover { background: #3d8b41; }
    #cloudSave:hover { background: #145ca3; }

    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .hidden { display: none; }

    .back-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .back-btn {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #555;
      color: #fff;
    }

    /* PC向け（広く） */
    @media (min-width: 900px) {
      .container {
        max-width: 100%;
      }
      main {
        padding: 20px 40px 32px;
      }
      .card {
        padding: 14px 16px;
      }
      .tab {
        font-size: 15px;
        padding: 8px 16px;
      }
    }

    /* スマホ向け（小さく・全部入るように） */
    @media (max-width: 600px) {
      header h1 {
        font-size: 18px;
      }
      .tabs {
        gap: 4px;
      }
      .tab {
        font-size: 11px;
        padding: 5px 8px;
      }
      .card {
        padding: 10px;
      }
      .card-title {
        font-size: 15px;
      }
      .card-detail {
        font-size: 13px;
      }
      main {
        padding: 10px 8px 20px;
      }
    }
  </style>
</head>
<body>
<div class="container">

<header>
  <h1>tetsudo-site6</h1>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="すべて">すべて</div>
    <div class="tab" data-tab="京王">京王</div>
    <div class="tab" data-tab="JR">JR</div>
    <div class="tab" data-tab="大手私鉄">大手私鉄</div>
    <div class="tab" data-tab="その他">その他</div>
    <div class="tab" data-tab="資料">資料</div>
    <div class="tab" data-tab="画像">画像</div>
    <div class="tab" data-tab="同期・管理">同期・管理</div>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="タイトルで検索…">
</div>

<main>
  <!-- 一覧画面 -->
  <div id="listSection">
    <div class="section-title" id="sectionTitle">すべて</div>
    <div class="card-list" id="cardList"></div>
  </div>

  <!-- 追加 / 編集画面 -->
  <div id="settingsSection" class="hidden">
    <div class="section-title">同期・管理</div>

    <div class="settings" id="passwordBlock">
      <label>編集パスワード</label>
      <input type="password" id="adminPass" placeholder="パスワードを入力">
      <button id="passSubmit" style="background:#555;color:#fff;">送信</button>
      <div class="hint">正しいパスワードを入力すると追加・編集・削除が有効になります。</div>
    </div>

    <div class="settings hidden" id="formBlock">
      <div class="back-row">
        <button class="back-btn" id="backToList">◀ 戻る</button>
        <span id="formModeLabel" style="font-size:14px;color:#333;"></span>
      </div>

      <div class="section-title" id="formTitle">新規URL追加</div>

      <label>タイトル</label>
      <input type="text" id="newTitle">

      <label>URL</label>
      <input type="text" id="newURL">

      <label>詳細</label>
      <textarea id="newDetail"></textarea>

      <label>カテゴリ</label>
      <select id="newCategory">
        <option value="京王">京王</option>
        <option value="JR">JR</option>
        <option value="大手私鉄">大手私鉄</option>
        <option value="その他">その他</option>
        <option value="資料">資料</option>
        <option value="画像">画像</option>
      </select>

      <button id="addSubmit" style="background:#1976d2;color:#fff;">追加</button>

      <hr style="margin:16px 0;">

      <button id="cloudLoad">クラウド受信</button>
      <button id="cloudSave">クラウド保存</button>
    </div>
  </div>
</main>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD55Pawag1UichGwM-Uxddivb8lFr7QOU8",
    authDomain: "tetsudo-site6.firebaseapp.com",
    databaseURL: "https://tetsudo-site6-default-rtdb.firebaseio.com",
    projectId: "tetsudo-site6",
    storageBucket: "tetsudo-site6.firebasestorage.app",
    messagingSenderId: "563943849207",
    appId: "1:563943849207:web:1c813365201cb431d6e7f2"
  };

  const PASSWORD = "0829";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase();
  const auth = getAuth();

  let items = [];
  let currentTab = "すべて";
  let searchText = "";
  let adminMode = false;
  let editIndex = null;
  let viewMode = "list"; // "list" or "settings"

  const tabsEl = document.getElementById("tabs");
  const searchInput = document.getElementById("searchInput");
  const cardList = document.getElementById("cardList");
  const sectionTitle = document.getElementById("sectionTitle");
  const listSection = document.getElementById("listSection");
  const settingsSection = document.getElementById("settingsSection");

  const adminPass = document.getElementById("adminPass");
  const passSubmit = document.getElementById("passSubmit");
  const passwordBlock = document.getElementById("passwordBlock");
  const formBlock = document.getElementById("formBlock");
  const newTitle = document.getElementById("newTitle");
  const newURL = document.getElementById("newURL");
  const newDetail = document.getElementById("newDetail");
  const newCategory = document.getElementById("newCategory");
  const addSubmit = document.getElementById("addSubmit");
  const formTitle = document.getElementById("formTitle");
  const formModeLabel = document.getElementById("formModeLabel");
  const backToList = document.getElementById("backToList");

  const cloudLoad = document.getElementById("cloudLoad");
  const cloudSave = document.getElementById("cloudSave");

  signInAnonymously(auth).then(() => {
    loadFromFirebase();
  });

  function loadFromFirebase() {
    const dataRef = ref(db, "urlData");
    onValue(dataRef, (snapshot) => {
      const val = snapshot.val();
      items = val ? val : [];
      render();
    });
  }

  function saveToFirebase() {
    const dataRef = ref(db, "urlData");
    set(dataRef, items);
  }

  function updateView() {
    if (viewMode === "list") {
      listSection.classList.remove("hidden");
      settingsSection.classList.add("hidden");
    } else {
      listSection.classList.add("hidden");
      settingsSection.classList.remove("hidden");
    }
  }

  function resetForm() {
    editIndex = null;
    formTitle.textContent = "新規URL追加";
    formModeLabel.textContent = "";
    addSubmit.textContent = "追加";
    newTitle.value = "";
    newURL.value = "";
    newDetail.value = "";
    newCategory.value = "京王";
    passwordBlock.classList.add("hidden");
    formBlock.classList.remove("hidden");
  }

  function render() {
    sectionTitle.textContent = currentTab;

    const filtered = items
      .filter(item => {
        if (currentTab !== "すべて" && item.category !== currentTab) return false;
        if (!searchText) return true;
        return (item.title || "").toLowerCase().includes(searchText.toLowerCase());
      })
      .sort((a, b) => (a.title || "").localeCompare(b.title || "", "ja"));

    cardList.innerHTML = "";
    filtered.forEach((item, index) => {
      const card = document.createElement("div");
      const catClass = "cat-" + (item.category || "");
      card.className = "card " + catClass;

      const cat = document.createElement("div");
      cat.className = "card-category";
      cat.textContent = item.category || "";

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = item.title || "";

      const detail = document.createElement("div");
      detail.className = "card-detail";
      detail.textContent = item.detail || "";

      card.appendChild(cat);
      card.appendChild(title);
      card.appendChild(detail);

      if (adminMode) {
        const btns = document.createElement("div");
        btns.className = "edit-buttons";

        const editBtn = document.createElement("button");
        editBtn.className = "edit-btn";
        editBtn.textContent = "編集";
        editBtn.onclick = () => startEdit(item, index);

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "削除";
        delBtn.onclick = () => deleteItem(index);

        btns.appendChild(editBtn);
        btns.appendChild(delBtn);
        card.appendChild(btns);
      } else {
        card.onclick = () => {
          if (item.url) window.open(item.url, "_blank");
        };
      }

      cardList.appendChild(card);
    });
  }

  function startEdit(item, index) {
    if (!adminMode) return;
    editIndex = index;
    formTitle.textContent = "URL編集";
    formModeLabel.textContent = "編集モード";
    addSubmit.textContent = "保存";

    newTitle.value = item.title || "";
    newURL.value = item.url || "";
    newDetail.value = item.detail || "";
    newCategory.value = item.category || "京王";

    viewMode = "settings";
    passwordBlock.classList.add("hidden");
    formBlock.classList.remove("hidden");
    updateView();
  }

  function deleteItem(index) {
    if (!adminMode) return;
    if (!confirm("削除しますか？")) return;
    items.splice(index, 1);
    saveToFirebase();
    render();
  }

  tabsEl.addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    const tabName = tab.dataset.tab;

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    if (tabName === "同期・管理") {
      viewMode = "settings";
      updateView();
      return;
    }

    currentTab = tabName;
    viewMode = "list";
    updateView();
    render();
  });

  searchInput.addEventListener("input", () => {
    searchText = searchInput.value.trim();
    render();
  });

  passSubmit.addEventListener("click", () => {
    if (adminPass.value === PASSWORD) {
      adminMode = true;
      adminPass.value = "";
      alert("編集モードが有効になりました");
      passwordBlock.classList.add("hidden");
      formBlock.classList.remove("hidden");
      resetForm();
      render();
    } else {
      alert("パスワードが違います");
    }
  });

  addSubmit.addEventListener("click", () => {
    const title = newTitle.value.trim();
    const url = newURL.value.trim();
    const detail = newDetail.value.trim();
    const category = newCategory.value;

    if (!title || !url) {
      alert("タイトルとURLは必須です");
      return;
    }

    if (editIndex !== null) {
      items[editIndex] = { title, url, detail, category };
    } else {
      items.push({ title, url, detail, category });
    }

    saveToFirebase();
    alert("保存しました");
    resetForm();
    viewMode = "list";
    updateView();
    render();
  });

  backToList.addEventListener("click", () => {
    resetForm();
    viewMode = "list";
    updateView();
    render();
  });

  cloudLoad.addEventListener("click", () => {
    loadFromFirebase();
    alert("クラウドから最新データを読み込みました");
  });

  cloudSave.addEventListener("click", () => {
    saveToFirebase();
    alert("クラウドに保存しました");
  });

  // 初期表示
  updateView();
  render();
</script>

</body>
</html>
